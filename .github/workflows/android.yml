name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test

  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'app/src-tauri -> target' }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/src-tauri/**/*.gradle*', 'app/src-tauri/Cargo.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Use the runner's preinstalled NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx tauri android init --ci
      - name: Allow http:// (LAN / USB testing against the Mac)
        run: |
          set -euo pipefail
          F=src-tauri/gen/android/app/build.gradle.kts
          grep -n 'usesCleartextTraffic' "$F"
          sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/' "$F"
          grep -q 'usesCleartextTraffic"\] = "false"' "$F" && { echo "::error::cleartext still disabled"; exit 1; } || true
          grep -q 'usesCleartextTraffic"\] = "true"' "$F" || { echo "::error::usesCleartextTraffic placeholder not found"; exit 1; }
      - run: bun run android:build

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Signing secrets missing (ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD)"; exit 1; fi
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "Built: $UNSIGNED"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          printf %s "$KEYSTORE_B64" | base64 -d -i > "$RUNNER_TEMP/koro.jks"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/koro.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --out out/koro.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify out/koro.apk
          rm -f "$RUNNER_TEMP/koro.jks"
          ls -lh out/koro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: koro-apk
          path: app/out/koro.apk
          retention-days: 30
